<style>
:root{
  --ink:#3D3D3D;--bg:#F6F6F6;--card:#FFFFFF;--line:#EAEAEA;--muted:#6B6B6B;
  --magenta:#E6007E;--magenta-text:#B00062;--magenta-hell:#FDE6F2;--rose:#FDF2F8;
  --cyan:#089CD8;--cyan-text:#04587E;--cyan-hell:#E1F3FB;
  --gelb:#FECD04;--gelb-hell:#FFF4C2;--gelb-text:#5C4700;
  --chili:#F04438;--chili-text:#B42318;--chili-hell:#FDE7E5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default;opacity:.4}
button:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;font-style:italic}
img{display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
/* Kopf */
.kopf{background:var(--ink);color:#fff;border-bottom:4px solid var(--magenta)}
.kopf .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.marke{display:flex;align-items:center;gap:14px}
.marke img{height:54px;width:auto}
.trenn{width:1px;height:38px;background:#5A5A5A}
.marke b{display:block;font-weight:600;font-style:italic;font-size:21px;line-height:1.15}
.marke small{display:block;font-size:12px;color:#CFCFCF}
.kopf-rechts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.storewahl{display:flex;gap:4px;padding:4px;background:#2E2E2E;border-radius:999px}
.storewahl button{min-height:44px;padding:0 18px;border:0;border-radius:999px;font-weight:500;font-size:15px;background:transparent;color:#E0E0E0}
.storewahl button[aria-pressed="true"]{background:var(--magenta);color:#fff}
.kbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #6A6A6A;background:transparent;color:#fff;font-weight:500;font-size:14px;text-decoration:none}
.kbtn.voll{background:var(--magenta);border-color:var(--magenta)}
/* Inhalt */
main.wrap{display:flex;flex-direction:column;gap:20px;padding-top:22px;padding-bottom:10px}
.karte{background:var(--card);border:1px solid var(--line);border-radius:18px}
.datum{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.datum-kopf{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.datum-nav{display:flex;align-items:center;gap:12px;min-width:0}
.pfeil{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--line);border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center}
.datum-titel b{display:block;font-weight:600;font-style:italic;font-size:26px;line-height:1.1}
.datum-titel small{display:block;font-size:13px;color:var(--muted)}
.modus{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
.modus i{width:8px;height:8px;border-radius:50%;display:inline-block}
.btn2{min-height:44px;padding:0 18px;border:2px solid var(--magenta);border-radius:999px;background:#fff;color:var(--magenta-text);font-weight:600;font-size:14px}
.tage{position:relative;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tag{flex:0 0 90px;min-height:66px;padding:8px 11px;border-radius:14px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left}
.tag small{font-size:12px;font-weight:500;color:var(--muted)}
.tag b{font-weight:600;font-style:italic;font-size:18px}
.tag span{font-size:12px;color:var(--muted)}
.tag[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
.tag[aria-pressed="true"] small,.tag[aria-pressed="true"] span{color:#FFE3F1}
.cis{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-top:12px;border-top:1px solid var(--line)}
.cis>b{font-size:13px;font-weight:600}
.ci{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;font-size:13px}
.ci i{flex:0 0 auto;width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal}
.ci.ok{background:var(--cyan-hell)}.ci.ok i{background:var(--cyan)}
.ci.offen{background:#F0F0F0}.ci.offen i{background:#8A8A8A}
.ci.fehlt{background:var(--chili-hell);color:var(--chili-text)}.ci.fehlt i{background:var(--chili)}
/* gelbe Box */
.wichtig{background:var(--gelb);border-radius:20px;padding:18px 20px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px}
.wichtig-inhalt{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:12px}
.wichtig h2{font-weight:700;font-size:25px;line-height:1.1;color:#C2006A}
.wichtig ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.wichtig li{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:10px 14px;border-radius:14px;background:#fff}
.chip-rub{padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;background:var(--ink);color:#fff}
.wichtig li b{font-size:14px;font-weight:600}
.wichtig .hwtxt{flex:1 1 260px;min-width:0;font-size:14px;white-space:pre-line}
.bangy{flex:0 0 auto;display:flex;align-items:flex-end;gap:4px;margin:0 auto}
.bangy img{height:160px;width:auto}
.blase{align-self:flex-start;padding:8px 14px;border-radius:18px 18px 18px 4px;background:#fff;color:var(--magenta);font-family:'Cherry Bomb One',Kanit,sans-serif;font-size:18px;white-space:nowrap}
/* Rubriken */
.abschnitt-kopf{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.abschnitt-kopf h2{font-size:25px;color:var(--magenta)}
.abschnitt-kopf small{font-size:13px;color:var(--muted)}
.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kachel{min-height:108px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:left}
.kachel.rot{border-color:#F8B4AE}
.kachel[aria-pressed="true"]{border-color:var(--magenta)}
.kachel .n{font-weight:600;font-style:italic;font-size:32px;line-height:1}
.kachel .bar{display:flex;gap:3px;height:6px}
.kachel .bar i{border-radius:3px;display:block}
.kachel .note{font-size:12px;font-weight:600}
.legende{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legende img{height:14px;width:auto}
.info{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;background:var(--rose);font-size:13px}
.info svg{color:var(--magenta)}
.gruppe{padding:14px 18px 8px;display:flex;flex-direction:column;border-width:2px}
.gruppe.rot{border-color:#F8B4AE}
.gruppe-kopf{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding-bottom:10px}
.gruppe-kopf h3{font-size:21px;display:flex;align-items:center;gap:10px}
.gruppe-kopf h3 span{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--magenta);color:#fff;font-size:13px;font-style:normal;display:inline-flex;align-items:center;justify-content:center}
.gruppe-kopf small{font-size:13px;color:var(--muted)}
.gruppe ul{margin:0;padding:0;list-style:none}
.gruppe li.fall{border-top:1px solid var(--line)}
.zeile{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 2px;border:0;background:transparent;text-align:left}
.pill{flex:0 0 196px;display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600}
.pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.zeile .txt{flex:999 1 240px;min-width:0;display:flex;flex-direction:column;gap:1px}
.zeile .txt b{font-weight:500;font-size:16px;line-height:1.35}
.zeile .txt small{font-size:12px;color:var(--muted)}
.zeile .rechts{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px}
.zeile .rechts img{height:22px;width:auto}
.hw-mini{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--gelb-hell);color:var(--gelb-text);font-size:12px;font-weight:600}
.hw-mini i{width:8px;height:8px;border-radius:50%;background:var(--gelb);display:inline-block}
.frist{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600}
.chev{transition:transform .15s}
.details{display:flex;flex-direction:column;gap:12px;padding:2px 2px 16px}
.stufen{display:flex;gap:4px;margin:0;padding:0;list-style:none}
.stufen li{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:12px}
.stufen li i{display:block;height:7px;border-radius:4px}
.frist-lang{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;font-size:14px;font-weight:500}
.hw-box{display:flex;flex-direction:column;gap:3px;padding:12px 16px;border-radius:14px;background:var(--gelb-hell);border:1px solid var(--gelb)}
.hw-box b{font-size:12px;font-weight:600;color:var(--gelb-text);letter-spacing:.04em}
.hw-box span{font-size:15px;white-space:pre-line}
.hw-box small{font-size:12px;color:#6B5A1E}
.verlauf{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.verlauf li{display:flex;gap:12px;align-items:flex-start}
.verlauf li>i{flex:0 0 auto;width:10px;height:10px;margin-top:6px;border-radius:50%;display:block}
.verlauf small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.verlauf span{font-size:14px}
.mehr{align-self:flex-start;min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--magenta-text);font-size:14px;font-weight:600}
.leer{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px}
.haken{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--cyan);color:#fff;display:flex;align-items:center;justify-content:center}
.haken.dunkel{background:var(--ink)}
.liste{padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.liste h2{font-size:21px}
.liste ul{margin:0;padding:0;list-style:none}
.liste li{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.liste li div{display:flex;flex-direction:column;min-width:0}
.liste li b{font-weight:500;font-size:15px}
.liste li small{font-size:12px;color:var(--muted)}
.fuss{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:12px 0 28px;border-top:1px solid var(--line)}
.fuss .signoff{display:flex;align-items:center;gap:12px;font-weight:600;font-style:italic;font-size:18px;color:var(--magenta)}
.fuss .signoff img{height:44px;width:auto}
.fuss small{font-size:12px;color:var(--muted)}
.dreht{animation:dreh 1s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
/* Login / Meldungen */
.schirm{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--ink)}
.login{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;text-align:center;border-top:6px solid var(--magenta)}
.login .logo-gross{margin:0 auto;height:96px;width:auto}
.login h1{font-size:24px;color:var(--magenta)}
.login p{margin:0;color:var(--muted);font-size:14px}
.gbtn{min-height:48px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.fehler{padding:10px 14px;border-radius:14px;background:var(--chili-hell);color:var(--chili-text);font-size:14px;text-align:left}
.laden{padding:40px 20px;text-align:center;color:var(--muted)}
@media (max-width:560px){
  .wrap{padding:0 14px}
  .pill{flex-basis:auto}
  .datum-titel b{font-size:21px}
  .marke small,.trenn{display:none}
  .marke img{height:44px}
  .bangy img{height:120px}
}
</style>
</head>

function urlParam(k) { var m = new RegExp('[?&]' + k + '=([^&]+)').exec(location.search); return m ? decodeURIComponent(m[1]).toUpperCase() : null; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function ms(iso) { var p = iso.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function diff(a, b) { return Math.round((ms(b) - ms(a)) / 86400000); }
function wd(iso) { return new Date(ms(iso)).getUTCDay(); }
function dm(iso) { return iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.'; }
function kurz(iso) { return ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][wd(iso)] + ' ' + dm(iso); }
function lang(iso) { return ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'][wd(iso)] + ', ' + dm(iso) + iso.slice(0, 4); }

// ── Login (eigene Sitzung, unabhängig vom BBN-Cockpit – das meldet nach 4 h Inaktivität ab) ──
var storeApp = firebase.initializeApp(firebaseConfig, 'store-uebersicht');
var auth = storeApp.auth();
auth.onAuthStateChanged(function (u) {
  S.user = u; S.authBereit = true;
  if (u) laden(false); else { S.daten = null; render(); }
});
function anmelden() {
  var p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({ prompt: 'select_account', hd: FIRMEN_DOMAIN });
  S.loginFehler = '';
  auth.signInWithPopup(p).catch(function (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') { auth.signInWithRedirect(p); return; }
    if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') { S.loginFehler = 'Anmeldung fehlgeschlagen: ' + e.message; render(); }
  });
}
function abmelden() { S.fehler = null; S.daten = null; auth.signOut(); }

// ── Daten holen (frisch = Knopf „Aktualisieren": sofort neu aus Asana) ──
function laden(stumm, frisch) {
  if (!S.user) return;
  if (frisch) S.frischLaeuft = true;
  if (!stumm || frisch) { S.laden = !stumm; render(); }
  var warHeute = S.daten && S.tag === S.daten.heute;
  S.user.getIdToken().then(function (tok) {
    return fetch(OPS_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ idToken: tok, store: S.storeKurz || '', frisch: !!frisch }) });
  }).then(function (r) { return r.json(); }).then(function (a) {
    S.laden = false; S.frischLaeuft = false; S.abgefragt = Date.now();
    if (!a.ok) { S.fehler = a; render(); return; }
    var storeWechsel = !S.daten || S.daten.store.kurz !== a.daten.store.kurz;
    S.fehler = null; S.email = a.email; S.stores = a.stores; S.daten = a.daten; S.storeKurz = a.daten.store.kurz;
    if (storeWechsel || warHeute || !S.tag || S.daten.tage.indexOf(S.tag) === -1) S.tag = S.daten.heute;
    if (storeWechsel) { S.rub = null; S.offen = {}; S.mehr = {}; }
    try { history.replaceState(null, '', location.pathname + '?store=' + S.storeKurz); } catch (e) {}
    document.title = 'bang bang noodles · ' + S.daten.store.name;
    render();
  }).catch(function (e) {
    S.laden = false; S.frischLaeuft = false;
    S.fehler = { code: 'netz', fehler: 'Keine Verbindung zur Datenquelle. Bitte kurz warten und neu laden.' };
    render();
  });
}
setInterval(function () { if (S.user && document.visibilityState === 'visible') laden(true); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.user && Date.now() - S.abgefragt > 5 * 60 * 1000) laden(true);
});

// ── Logik: Stand eines Falls am Betriebstag D ──
function fallAm(f, D) {
  var v = f.verlauf.filter(function (e) { return e[0] <= D; });
  if (!v.length) return null;
  var status = 'neu', sektion = 'neu', erledigtAm = null, frist = null, fristBisD = false, hinweis = '', hinweisAb = null;
  var fristVerlauf = f.verlauf.some(function (e) { return e[2] === 'frist'; });
  var hinweisVerlauf = f.verlauf.some(function (e) { return e[2] === 'hinweis'; });
  v.forEach(function (e) {
    if (e[2] === 'neu') { status = 'neu'; sektion = 'neu'; }
    else if (e[2] === 'status') {
      if (e[3] === 'erledigt') { status = 'erledigt'; erledigtAm = e[0]; }
      else { status = e[3]; sektion = e[3]; erledigtAm = null; }
    }
    else if (e[2] === 'wieder') { status = sektion; erledigtAm = null; }
    else if (e[2] === 'frist') { frist = e[3]; fristBisD = true; }
    else if (e[2] === 'hinweis') { hinweis = e[3] || ''; hinweisAb = e[0]; }
  });
  if (!fristVerlauf) frist = f.due;
  else if (!fristBisD) frist = null;
  if (!hinweisVerlauf && f.hinweis) { hinweis = f.hinweis; hinweisAb = v[0][0]; }
  return { f: f, v: v, status: status, erledigtAm: erledigtAm, frist: frist, hinweis: status === 'erledigt' ? '' : hinweis,
           hinweisAb: hinweisAb, gemeldetAm: f.verlauf[0][0] };
}

function fristInfo(x, D) {
  var s = x.status;
  if (s === 'rueckfrage') return { kurz: 'wird geklärt', lang: 'Wird gerade geklärt – Frist folgt', bg: 'var(--gelb-hell)', fg: 'var(--gelb-text)', over: false };
  if (s === 'neu') {
    var alter = diff(x.gemeldetAm, D);
    if (alter <= 0) return { kurz: 'neu gemeldet', lang: 'Noch nicht übernommen – wird eingeordnet', bg: 'var(--magenta-hell)', fg: 'var(--magenta-text)', over: false };
    var t = alter + (alter === 1 ? ' Tag' : ' Tage') + ' ohne Rückmeldung';
    return { kurz: t, lang: 'Seit ' + alter + (alter === 1 ? ' Tag' : ' Tagen') + ' ohne Rückmeldung', bg: 'var(--magenta-hell)', fg: 'var(--magenta-text)', over: false };
  }
  if (x.frist) {
    var n = diff(D, x.frist);
    if (n < 0) return { kurz: 'Frist überschritten', lang: 'Frist überschritten – war geplant bis ' + kurz(x.frist) + ', wird nachgefasst', bg: 'var(--chili-hell)', fg: 'var(--chili-text)', over: true };
    var rest = n === 0 ? 'Frist endet heute' : (n === 1 ? 'noch 1 Tag' : 'noch ' + n + ' Tage');
    return { kurz: n === 0 ? 'Frist heute' : 'bis ' + kurz(x.frist), lang: 'Lösung geplant bis ' + kurz(x.frist) + ' · ' + rest, bg: 'var(--cyan-hell)', fg: 'var(--cyan-text)', over: false };
  }
  return { kurz: 'keine Frist', lang: 'In Bearbeitung – noch keine Frist gesetzt', bg: '#F0F0F0', fg: 'var(--ink)', over: false };
}

function verlaufText(f, e) {
  if (e[2] === 'neu') return (f.schicht ? 'Gemeldet im ' + f.schicht + '-Check-in' : 'Angelegt') + (f.von ? ' von ' + f.von : '');
  if (e[2] === 'status') return { uebernommen: 'Übernommen', arbeit: 'In Arbeit', rueckfrage: 'In Klärung', neu: 'Zurück auf „Noch nicht übernommen“', erledigt: 'Behoben' }[e[3]] || 'Status geändert';
  if (e[2] === 'frist') return e[3] ? 'Frist gesetzt: bis ' + kurz(e[3]) : 'Frist entfernt';
  if (e[2] === 'hinweis') return e[3] ? 'Hinweis für die Schicht aktualisiert' : 'Hinweis entfernt';
  if (e[2] === 'wieder') return 'Wieder geöffnet';
  return '';
}
function verlaufDot(e) {
  if (e[2] === 'neu') return ST.neu.dot;
  if (e[2] === 'status') return (ST[e[3]] || ST.arbeit).dot;
  if (e[2] === 'hinweis') return '#FECD04';
  return '#B5B5B5';
}
function stufen(s) {
  var stufe = ST[s].stufe, farbe = ST[s].dot;
  return ['Gemeldet', s === 'rueckfrage' ? 'In Klärung' : 'Übernommen', 'In Arbeit', 'Behoben'].map(function (l, i) {
    var done = i + 1 <= stufe, klaer = s === 'rueckfrage' && i === 1;
    var cur = klaer || (i + 1 === stufe && s !== 'rueckfrage');
    var bar = done ? farbe : (klaer ? '#FFE680' : '#EAEAEA');
    return '<li style="color:' + (cur || done ? '#3D3D3D' : '#6B6B6B') + ';font-weight:' + (cur ? 600 : 400) + '"><i style="background:' + bar + '"></i>' + l + '</li>';
  }).join('');
}

// ── Darstellung ──
function render() {
  var app = document.getElementById('app');
  if (!S.authBereit) { app.innerHTML = '<div class="schirm"><div class="login"><p>Lade …</p></div></div>'; return; }
  if (!S.user || (S.fehler && S.fehler.code === 'login')) { app.innerHTML = loginHtml(); return; }
  if (S.fehler && !S.daten) { app.innerHTML = fehlerHtml(); return; }
  if (!S.daten) { app.innerHTML = kopfHtml() + '<main class="wrap"><div class="karte laden">Lade Daten aus Asana …</div></main>'; return; }
  app.innerHTML = kopfHtml() + seiteHtml();
  // gewählten Tag in der Tagesleiste sichtbar halten (ohne die Seite zu verschieben)
  var t = document.getElementById('tage'), sel = t && t.querySelector('[aria-pressed="true"]');
  if (sel) t.scrollLeft = Math.max(0, sel.offsetLeft - (t.clientWidth - sel.offsetWidth) / 2);
}

}

function kopfHtml() {
  var wahl = S.stores.length > 1 ? '<div class="storewahl" role="group" aria-label="Store wählen">' + S.stores.map(function (s) {
    return '<button data-act="store" data-wert="' + esc(s.kurz) + '" aria-pressed="' + (s.kurz === S.storeKurz) + '">' + esc(s.name) + '</button>';

    '<div class="kopf-rechts">' + wahl +
    (FORM_URL ? '<a class="kbtn voll" href="' + esc(FORM_URL) + '" target="_blank" rel="noopener">Check-in ausfüllen</a>' : '') +
    '<button class="kbtn" data-act="neuLaden" title="Jetzt frisch aus Asana holen"' + (S.frischLaeuft ? ' disabled' : '') + '>' +
    '<span class="' + (S.frischLaeuft ? 'dreht' : '') + '" style="display:inline-flex">' + IC.neuLaden + '</span>' + (S.frischLaeuft ? 'Hole Daten …' : 'Aktualisieren') + '</button>' +
    '<button class="kbtn" data-act="abmelden" title="' + esc(S.email) + '">Abmelden</button>' +
    '</div></div></header>';
}

function seiteHtml() {
  var d = S.daten, D = S.tag, istHeute = D === d.heute, idx = d.tage.indexOf(D);
  var alle = d.faelle.map(function (f) { return fallAm(f, D); }).filter(Boolean);
  var offen = alle.filter(function (x) { return x.status !== 'erledigt'; });
  offen.forEach(function (x) { x.fr = fristInfo(x, D); });
  var behoben = alle.filter(function (x) { return x.status === 'erledigt' && x.erledigtAm && diff(x.erledigtAm, D) <= 2; });
  var sortFn = function (a, b) {
    var ra = a.fr.over ? 0 : ST[a.status].rang, rb = b.fr.over ? 0 : ST[b.status].rang;
    if (ra !== rb) return ra - rb;
    if (!!a.f.dringend !== !!b.f.dringend) return a.f.dringend ? -1 : 1;
    return a.gemeldetAm < b.gemeldetAm ? -1 : (a.gemeldetAm > b.gemeldetAm ? 1 : 0);
  };
  var rubriken = RUBRIKEN.slice();
  if (offen.some(function (x) { return rubriken.indexOf(x.f.rubrik) === -1; })) rubriken.push('Sonstiges');
  var h = '<main class="wrap">';

  // Datum + Check-ins
  var stand = d.stand ? d.stand.slice(11, 16) : '';
  h += '<section class="karte datum" aria-label="Datum"><div class="datum-kopf"><div class="datum-nav">' +
    '<button class="pfeil" data-act="prev" aria-label="Vorheriger Tag"' + (idx <= 0 ? ' disabled' : '') + '>' + IC.links + '</button>' +
    '<div class="datum-titel"><b>' + lang(D) + '</b><small>' + esc(d.store.name) + ' · ' +
    (istHeute ? 'Live-Stand, aktualisiert ' + esc(stand) + ' Uhr' : 'Rückblick: Stand am Ende des Tages') + '</small></div>' +
    '<button class="pfeil" data-act="next" aria-label="Nächster Tag"' + (istHeute ? ' disabled' : '') + '>' + IC.rechts + '</button></div>' +
    '<div style="display:flex;align-items:center;gap:10px">' +
    '<span class="modus" style="background:' + (istHeute ? 'var(--cyan-hell);color:var(--cyan-text)' : '#F0F0F0;color:var(--ink)') + '"><i style="background:' + (istHeute ? '#089CD8' : '#8A8A8A') + '"></i>' + (istHeute ? 'Live' : 'Rückblick') + '</span>' +
    (istHeute ? '' : '<button class="btn2" data-act="heute">Zu heute</button>') + '</div></div>';
  h += '<div class="tage" id="tage">' + d.tage.map(function (t) {
    var n = d.faelle.filter(function (f) { return f.verlauf[0] && f.verlauf[0][0] === t; }).length;
    return '<button class="tag" data-act="tag" data-wert="' + t + '" aria-pressed="' + (t === D) + '"><small>' + (t === d.heute ? 'Heute · ' : '') +
      ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][wd(t)] + '</small><b>' + dm(t) + '</b><span>' + (n === 0 ? 'keine Meldung' : (n === 1 ? '1 Meldung' : n + ' Meldungen')) + '</span></button>';
  }).join('') + '</div>';
  var ci = d.checkins[D] || [];
  var ciTeile = [];
  ['Opening', 'Ad hoc', 'Closing'].forEach(function (s) {
    var tr = ci.filter(function (c) { return c[0] === s; });
    tr.forEach(function (c) { ciTeile.push('<span class="ci ok"><i>' + IC.haken + '</i><b>' + s + '</b>' + esc(c[1]) + ' · ' + esc(c[2]) + '</span>'); });
    if (!tr.length && s !== 'Ad hoc') ciTeile.push(istHeute ? '<span class="ci offen"><i>' + IC.uhr + '</i><b>' + s + '</b>noch ausstehend</span>'
                                                             : '<span class="ci fehlt"><i>' + IC.ausruf + '</i><b>' + s + '</b>kein Check-in</span>');
  });
  h += '<div class="cis"><b>Check-ins</b>' + ciTeile.join('') + '</div></section>';

  // Für deine Schicht wichtig (gelbe Box, max. eine pro Seite)
  var wichtig = offen.slice().sort(sortFn).filter(function (x) { return x.hinweis; });
  if (wichtig.length) {
    h += '<section class="wichtig" aria-labelledby="h-w"><div class="wichtig-inhalt"><h2 id="h-w">für deine schicht wichtig</h2><ul>' +
      wichtig.map(function (x) {
        return '<li><span class="chip-rub">' + esc(x.f.rubrik) + '</span><b>' + esc(kurzTitel(x.f.titel)) + '</b><span class="hwtxt">' + esc(x.hinweis) + '</span></li>';
      }).join('') + '</ul></div>' +
      '<div class="bangy" aria-hidden="true"><span class="blase">Heads up!</span><img src="' + IMG.bangy + '" alt=""></div></section>';
  }

  // Lage nach Rubrik
  h += '<section aria-labelledby="h-r" style="display:flex;flex-direction:column;gap:12px"><div class="abschnitt-kopf"><h2 id="h-r">Lage nach Rubrik</h2><small>' +
    offen.length + ' offene Punkte · Rubrik antippen zum Filtern</small></div><div class="kacheln" role="group" aria-label="Nach Rubrik filtern">';
  rubriken.forEach(function (name) {
    var list = offen.filter(function (x) { return x.f.rubrik === name; });
    var over = 0, neu = 0, kl = 0, bl = 0;
    list.forEach(function (x) { if (x.fr.over) over++; else if (x.status === 'neu') neu++; else if (x.status === 'rueckfrage') kl++; else bl++; });
    var segs = [];
    if (over) segs.push([over, '#F04438']); if (neu) segs.push([neu, '#E6007E']); if (kl) segs.push([kl, '#FECD04']); if (bl) segs.push([bl, '#089CD8']);
    if (!segs.length) segs.push([1, '#EAEAEA']);
    var note, nfg;
    if (over) { note = over + ' Frist überschritten'; nfg = 'var(--chili-text)'; }
    else if (neu) { note = neu + ' noch nicht übernommen'; nfg = 'var(--magenta-text)'; }
    else if (list.length) { note = 'wird bearbeitet'; nfg = 'var(--cyan-text)'; }
    else { note = 'nichts offen'; nfg = 'var(--muted)'; }
    h += '<button class="kachel' + (over ? ' rot' : '') + '" data-act="rub" data-wert="' + esc(name) + '" aria-pressed="' + (S.rub === name) + '">' +
      '<b style="font-size:13px;font-weight:600">' + esc(name) + '</b>' +
      '<span><span class="n" style="color:' + (list.length ? '#3D3D3D' : '#B5B5B5') + '">' + list.length + '</span> <small style="color:var(--muted);font-size:12px">offen</small></span>' +
      '<span class="bar">' + segs.map(function (s) { return '<i style="flex:' + s[0] + ' 1 0;background:' + s[1] + '"></i>'; }).join('') + '</span>' +
      '<span class="note" style="color:' + nfg + '">' + note + '</span></button>';
  });
  h += '</div><div class="legende"><span><i style="background:#F04438"></i>Frist überschritten</span><span><i style="background:#E6007E"></i>Noch nicht übernommen</span>' +
    '<span><i style="background:#089CD8"></i>Übernommen / in Arbeit</span>' +
    '<span><img src="' + IMG.marker2 + '" alt="">Dringend</span></div></section>';

  // Offene Punkte nach Rubrik
  h += '<section aria-labelledby="h-o" style="display:flex;flex-direction:column;gap:14px"><div class="abschnitt-kopf"><h2 id="h-o">' +
    (S.rub ? 'Offene Punkte · ' + esc(S.rub) : 'Offene Punkte nach Rubrik') + '</h2>' +
    (S.rub ? '<button class="btn2" data-act="rub" data-wert="' + esc(S.rub) + '">Alle Rubriken zeigen</button>' : '') + '</div>' +
    '<div class="info">' + IC.info + '<span>Steht ein Problem schon hier, bitte nicht neu melden. Zeile antippen für Frist, Hinweis und Verlauf.</span></div>';
  var gruppen = 0;
  rubriken.forEach(function (name) {
    if (S.rub && S.rub !== name) return;
    var list = offen.filter(function (x) { return x.f.rubrik === name; }).sort(sortFn);
    if (!list.length) return;
    gruppen++;
    var nOver = list.filter(function (x) { return x.fr.over; }).length;
    var zaehl = {}, reihen = [];
    list.forEach(function (x) { var l = ST[x.status].label; if (!zaehl[l]) reihen.push(l); zaehl[l] = (zaehl[l] || 0) + 1; });
    var teile = reihen.map(function (l) { return zaehl[l] + ' ' + l.toLowerCase(); });
    if (nOver) teile.unshift(nOver + ' Frist überschritten');
    var alleZeigen = !!S.mehr[name] || !!S.rub;
    var sicht = alleZeigen ? list : list.slice(0, ZEILEN_PRO_RUBRIK);
    var rest = list.length - Math.min(list.length, ZEILEN_PRO_RUBRIK);
    h += '<section class="karte gruppe' + (nOver ? ' rot' : '') + '"><div class="gruppe-kopf"><h3>' + esc(name) + ' <span>' + list.length + '</span></h3><small>' + esc(teile.join(' · ')) + '</small></div><ul>' +
      sicht.map(function (x) { return zeileHtml(x, D); }).join('') + '</ul>' +
      (!S.rub && rest > 0 ? '<button class="mehr" data-act="mehr" data-wert="' + esc(name) + '">' + (S.mehr[name] ? 'Weniger anzeigen' : '+ ' + rest + ' weitere anzeigen') + '</button>' : '') +
      '</section>';
  });
  if (!gruppen) h += '<div class="karte leer"><span class="haken">' + IC.haken + '</span>' + (S.rub ? 'In „' + esc(S.rub) + '“ ist an diesem Tag nichts offen.' : 'Keine offenen Punkte an diesem Tag.') + '</div>';
  var leer = rubriken.filter(function (n) { return n !== 'Sonstiges' && !offen.some(function (x) { return x.f.rubrik === n; }); });
  if (!S.rub && gruppen && leer.length) h += '<div class="karte leer"><span class="haken">' + IC.haken + '</span>Ohne offene Punkte: ' + esc(leer.join(', ')) + '</div>';

  if (behoben.length) {
    h += '<section class="karte liste" aria-labelledby="h-b"><div class="abschnitt-kopf" style="padding-bottom:6px"><h2 id="h-b" style="color:var(--ink)">Kürzlich behoben</h2><small>bleibt 3 Tage sichtbar</small></div><ul>' +
      behoben.map(function (x) {
        return '<li><span class="haken dunkel">' + IC.haken + '</span><div><b>' + esc(x.f.titel) + '</b><small>' + esc(x.f.rubrik) + ' · gemeldet ' + kurz(x.gemeldetAm) + ' · behoben ' + kurz(x.erledigtAm) + '</small></div></li>';
      }).join('') + '</ul></section>';
  }
  var fb = d.feedback[D] || [];
  if (fb.length) {
    h += '<section class="karte liste" aria-labelledby="h-f"><h2 id="h-f">Gästefeedback</h2><ul>' + fb.map(function (g) {
      return '<li><div><small>' + esc(g[0]) + '-Check-in · ' + esc(g[1]) + ' Uhr</small><b style="white-space:pre-line">' + esc(g[2]) + '</b></div></li>';
    }).join('') + '</ul></section>';
  }
  h += '</section>';
  h += '<footer class="fuss"><span class="signoff"><img src="' + IMG.solo + '" alt="">jede schicht on point.</span>' +
    '<small>Nur zum Lesen · Meldungen kommen über den Check-in · Status, Frist und Hinweise pflegt Jan in Asana · ' + esc(S.email) + '</small></footer>';
  return h + '</main>';
}

function kurzTitel(t) { t = String(t || ''); return t.length > 42 ? t.slice(0, 41).trim() + '…' : t; }

function zeileHtml(x, D) {
  var f = x.f, st = ST[x.status], alter = diff(x.gemeldetAm, D), offen = !!S.offen[f.id];
  var meta = 'Gemeldet ' + kurz(x.gemeldetAm) + (f.von ? ' von ' + f.von : '') + ' · ' +
    (alter <= 0 ? 'heute gemeldet' : (alter === 1 ? 'seit 1 Tag offen' : 'seit ' + alter + ' Tagen offen'));
  if (f.dringend) meta += ' · dringend';
  var h = '<li class="fall"><button class="zeile" data-act="zeile" data-wert="' + esc(f.id) + '" aria-expanded="' + offen + '">' +
    '<span class="pill" style="background:' + st.bg + ';color:' + st.fg + '"><i style="background:' + st.dot + '"></i>' + st.label + '</span>' +
    '<span class="txt"><b>' + esc(f.titel) + '</b><small>' + esc(meta) + '</small></span>' +
    '<span class="rechts">' + (f.dringend ? '<img src="' + IMG.marker2 + '" alt="dringend" title="dringend">' : '') +
    (x.hinweis ? '<span class="hw-mini"><i></i>Hinweis</span>' : '') +
    '<span class="frist" style="background:' + x.fr.bg + ';color:' + x.fr.fg + '">' + esc(x.fr.kurz) + '</span>' +
    IC.chev.replace('class="chev"', 'class="chev" style="transform:' + (offen ? 'rotate(180deg)' : 'none') + '"') + '</span></button>';
  if (offen) {
    h += '<div class="details"><ol class="stufen" aria-label="Bearbeitungsstand">' + stufen(x.status) + '</ol>' +
      '<div class="frist-lang" style="background:' + x.fr.bg + ';color:' + x.fr.fg + '">' + IC.frist + '<span>' + esc(x.fr.lang) + '</span></div>' +
      (x.hinweis ? '<div class="hw-box"><b>HINWEIS FÜR DIE SCHICHT</b><span>' + esc(x.hinweis) + '</span><small>Stand: ' + (x.hinweisAb ? kurz(x.hinweisAb) : '') + ' · gepflegt in Asana</small></div>' : '') +
      '<ol class="verlauf" aria-label="Verlauf">' + x.v.map(function (e) {
        return '<li><i style="background:' + verlaufDot(e) + '"></i><div><small>' + kurz(e[0]) + ', ' + esc(e[1]) + ' Uhr</small><span>' + esc(verlaufText(f, e)) + '</span></div></li>';
      }).join('') + '</ol></div>';
  }
  return h + '</li>';
}

// ── Bedienung ──
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act'), wert = b.getAttribute('data-wert');
  var d = S.daten;
  if (act === 'anmelden') return anmelden();
  if (act === 'abmelden') return abmelden();
  if (act === 'neuLaden') { S.fehler = null; return laden(!!S.daten, true); }
  if (!d) return;
  var i = d.tage.indexOf(S.tag);
  if (act === 'prev' && i > 0) S.tag = d.tage[i - 1];
  else if (act === 'next' && i < d.tage.length - 1) S.tag = d.tage[i + 1];
  else if (act === 'heute') S.tag = d.heute;
  else if (act === 'tag') S.tag = wert;
  else if (act === 'rub') S.rub = S.rub === wert ? null : wert;
  else if (act === 'mehr') S.mehr[wert] = !S.mehr[wert];
  else if (act === 'zeile') S.offen[wert] = !S.offen[wert];
  else if (act === 'store') { if (wert !== S.storeKurz) { S.storeKurz = wert; S.daten = null; laden(false); } return; }
  var y = window.scrollY;
  render();
  window.scrollTo(0, y);
});
render();
</script>
</body>
</html>
